[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[project]
name = "code-harness"
dynamic = ["version"]
description = "Read-only, parser-backed engineering policy gate for Python, Go, Java, JavaScript and TypeScript"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-go>=0.25,<0.26",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
  "agent-client-protocol>=0.12.1,<0.13",
  "mcp>=1.26,<2",
  "tree-sitter-java>=0.23,<0.24",
]

[project.scripts]
code-harness = "code_harness.cli:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["tree_sitter_python", "tree_sitter_go", "tree_sitter_javascript", "tree_sitter_typescript"]
ignore_missing_imports = true
