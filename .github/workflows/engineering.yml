name: Engineering verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  engineering:
    name: Engineering checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.22"
          checksum: "741ff1f5742c5a4a25d2f829e8395355e43f7a5ae2ebc6368e9ae2df0efb69cf"
          python-version: "3.12"
      - name: Install the locked development environment
        run: uv sync --locked --group dev
      - name: Run the engineering policy gate
        run: uv run --no-sync code-harness --all
      - name: Type-check the sources and tests
        run: uv run --no-sync mypy src tests
      - name: Lint the sources and tests
        run: uv run --no-sync ruff check src tests
      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests
      - name: Run the test suite
        run: uv run --no-sync pytest -q
